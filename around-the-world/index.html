<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Around the world</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../assets/darts-shared.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <header class="navbar navbar-dark bg-primary shadow-sm py-2">
      <div class="container-fluid px-3 d-flex flex-wrap align-items-center">
        <span class="navbar-brand mb-0 h1 fs-5">Around the world</span>
        <div class="d-flex ms-auto gap-2 align-items-center">
          <a href="../index.html" class="btn btn-outline-light btn-sm" aria-label="Home" title="Home">
            <i class="bi bi-house" aria-hidden="true"></i>
          </a>
          <a
            href="../instructions.html?game=around-the-world"
            class="btn btn-outline-light btn-sm"
            aria-label="Instructions"
            title="Instructions"
          >
            <i class="bi bi-info-circle" aria-hidden="true"></i>
          </a>
          <button type="button" class="btn btn-outline-light btn-sm d-none" id="btn-abandon" aria-label="Abandon game">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            <span class="visually-hidden">Abandon game</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container-fluid px-3 py-3 pb-5">
      <!-- Setup -->
      <section id="screen-setup" class="screen">
        <h2 class="h4 mb-3">New game</h2>
        <p class="text-muted small mb-3">
          Single player. Visit every wedge in the chosen order; your score is the total number of darts thrown (lower is better).
        </p>
        <div class="mb-3">
          <label for="setup-player-name" class="form-label">Name</label>
          <input type="text" class="form-control form-control-lg" id="setup-player-name" maxlength="40" autocomplete="name" />
        </div>
        <div class="mb-4">
          <div class="form-label fs-6 mb-2">Mode</div>
          <div class="btn-group mode-toggle w-100" role="group" aria-label="Mode">
            <input
              type="radio"
              class="btn-check"
              name="setup-mode"
              id="mode-asc"
              value="asc"
              autocomplete="off"
              checked
            />
            <label class="btn btn-outline-primary" for="mode-asc">1 → 20</label>

            <input type="radio" class="btn-check" name="setup-mode" id="mode-desc" value="desc" autocomplete="off" />
            <label class="btn btn-outline-primary" for="mode-desc">20 → 1</label>

            <input type="radio" class="btn-check" name="setup-mode" id="mode-random" value="random" autocomplete="off" />
            <label class="btn btn-outline-primary" for="mode-random">Random</label>
          </div>
        </div>
        <button type="button" class="btn btn-primary btn-lg w-100 w-md-auto" id="btn-start-game">Start game</button>
      </section>

      <!-- Playing -->
      <section id="screen-game" class="screen d-none">
        <div id="random-progress-card" class="card border-primary mb-3 d-none">
          <div class="card-body py-2 px-3">
            <div id="random-progress-wrap">
              <div
                class="progress round-progress shadow-sm"
                id="random-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="20"
                aria-valuenow="0"
                aria-valuetext="0 of 20 wedges cleared"
              >
                <div
                  class="progress-bar round-progress-fill bg-primary"
                  id="random-progress-fill"
                  style="width: 0%"
                ></div>
              </div>
              <div class="d-flex justify-content-center align-items-baseline mt-1">
                <span class="small fw-semibold text-body text-nowrap" id="random-progress-label">0 / 20</span>
              </div>
            </div>
          </div>
        </div>

        <div id="sector-board-card" class="card border-warning shadow-sm mb-3 overflow-hidden">
          <div class="card-body py-2 px-2">
            <div class="dartboard-target-row d-flex flex-nowrap align-items-center justify-content-center gap-2 gap-md-3">
              <div class="dartboard-holder dartboard-holder--compact flex-shrink-0">
                <svg
                  id="dartboard-svg"
                  class="dartboard-svg"
                  viewBox="0 0 200 200"
                  role="img"
                  aria-labelledby="dartboard-aria-title"
                >
                  <title id="dartboard-aria-title">Dartboard — this round’s wedges highlighted</title>
                  <defs>
                    <filter id="dart-glow" x="-40%" y="-40%" width="180%" height="180%">
                      <feGaussianBlur stdDeviation="2" result="blur" />
                      <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                      </feMerge>
                    </filter>
                  </defs>
                  <circle cx="100" cy="100" r="96" fill="none" stroke="#3e2723" stroke-width="2" />
                  <g id="dartboard-sectors"></g>
                  <g id="dartboard-bull-group" class="dartboard-bull-group">
                    <circle
                      class="bull-ring-outer"
                      cx="100"
                      cy="100"
                      r="22"
                      fill="#1b5e20"
                      stroke="#3e2723"
                      stroke-width="1.5"
                    />
                    <circle
                      class="bull-ring-inner"
                      cx="100"
                      cy="100"
                      r="10"
                      fill="#b71c1c"
                      stroke="#3e2723"
                      stroke-width="1"
                    />
                  </g>
                  <text
                    id="dartboard-wedge-label"
                    x="100"
                    y="28"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    font-family="system-ui, -apple-system, sans-serif"
                    font-weight="900"
                    fill="#bf360c"
                    stroke="#ffffff"
                    stroke-width="1.5"
                    paint-order="stroke fill"
                    style="pointer-events: none; visibility: hidden"
                  >
                    20
                  </text>
                </svg>
              </div>
              <div
                id="round-wedge-numbers"
                class="round-wedge-numbers d-flex flex-wrap align-items-center flex-shrink-0"
                aria-live="polite"
              ></div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm mb-3">
          <div class="card-header py-3 d-flex flex-wrap justify-content-between align-items-start gap-2 gap-md-3">
            <div class="current-player-header">
              <span class="current-player-name" id="stat-player">—</span>
            </div>
            <div class="ms-auto text-center">
              <div class="small text-muted text-uppercase">Darts thrown (score)</div>
              <div class="display-6 fw-bold text-primary lh-1 mt-1" id="stat-total-darts">0</div>
            </div>
          </div>
          <div class="card-body pt-3">
            <div class="row g-2 mb-4">
              <div class="col-6">
                <button type="button" class="btn btn-success btn-lg w-100" id="btn-hit">Hit</button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-secondary btn-lg w-100" id="btn-miss">Miss</button>
              </div>
            </div>
            <div class="pending-hint-slot mb-1">
              <p class="small text-muted mb-0" id="pending-hint" aria-live="polite"></p>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <button type="button" class="btn btn-primary btn-lg w-100" id="btn-confirm-round" disabled>
                  Confirm
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-danger btn-lg w-100" id="btn-reset-round" disabled>
                  Reset
                </button>
              </div>
            </div>
            <button type="button" class="btn btn-outline-primary w-100 d-none" id="btn-nn">
              N/N — end round (unused darts do not count)
            </button>
          </div>
        </div>
      </section>

      <!-- Finished -->
      <section id="screen-finished" class="screen d-none">
        <h2 class="h4 mb-3">Finished</h2>
        <p class="lead">
          Total darts (final score):
          <strong id="final-dart-count">0</strong>
        </p>
        <p class="text-muted small mb-3">Lower is better.</p>
        <h3 class="h6 text-muted text-uppercase mb-2 letter-spacing-tight">Throws per sector</h3>
        <div class="table-responsive shadow-sm mb-4">
          <table class="table table-sm table-bordered table-striped mb-0 align-middle" id="sector-hits-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <button type="button" class="btn btn-primary btn-lg w-100" id="btn-new-from-finished">New game</button>
      </section>
    </main>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
