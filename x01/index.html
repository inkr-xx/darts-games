<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X01</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../assets/darts-shared.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <header class="navbar navbar-dark bg-primary shadow-sm py-2">
      <div class="container-fluid px-3 d-flex flex-wrap align-items-center">
        <span class="navbar-brand mb-0 h1 fs-5">X01</span>
        <div class="d-flex ms-auto gap-2 align-items-center">
          <a href="../index.html" class="btn btn-outline-light btn-sm" aria-label="Home" title="Home">
            <i class="bi bi-house" aria-hidden="true"></i>
          </a>
          <a href="../instructions.html?game=x01" class="btn btn-outline-light btn-sm" aria-label="Instructions" title="Instructions">
            <i class="bi bi-info-circle" aria-hidden="true"></i>
          </a>
          <button type="button" class="btn btn-outline-light btn-sm d-none" id="btn-abandon" aria-label="Abandon game">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            <span class="visually-hidden">Abandon game</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container-fluid px-3 py-3 pb-5">
      <section id="screen-setup" class="screen">
        <h2 class="h4 mb-3">New X01 game</h2>
        <p class="text-muted small mb-3">Add players in throwing order. Names are saved for next time.</p>

        <div class="card shadow-sm mb-3">
          <div class="card-body vstack gap-3">
            <div>
              <label for="setup-start-score" class="form-label fw-semibold">Starting score</label>
              <select class="form-select form-select-lg" id="setup-start-score">
                <option value="301" selected>301</option>
                <option value="501">501</option>
              </select>
            </div>
            <div>
              <label for="setup-in-mode" class="form-label fw-semibold">Start condition</label>
              <select class="form-select form-select-lg" id="setup-in-mode">
                <option value="direct" selected>Direct in</option>
                <option value="double">Double in</option>
              </select>
            </div>
            <div>
              <label for="setup-out-mode" class="form-label fw-semibold">End condition</label>
              <select class="form-select form-select-lg" id="setup-out-mode">
                <option value="direct" selected>Direct out</option>
                <option value="double">Double out</option>
              </select>
            </div>
            <div>
              <label for="setup-match-length" class="form-label fw-semibold">Match length</label>
              <select class="form-select form-select-lg" id="setup-match-length">
                <option value="1" selected>Single game</option>
                <option value="3">Best of 3 games</option>
                <option value="5">Best of 5 games</option>
                <option value="7">Best of 7 games</option>
              </select>
            </div>
          </div>
        </div>

        <div id="setup-players" class="vstack gap-2 mb-3"></div>
        <div class="d-flex flex-wrap gap-2 mb-3">
          <button type="button" class="btn btn-outline-secondary" id="btn-add-player">Add player</button>
          <button type="button" class="btn btn-outline-secondary" id="btn-fill-last">Use last names</button>
        </div>
        <button type="button" class="btn btn-primary btn-lg w-100 w-md-auto" id="btn-start-game">Start game</button>
      </section>

      <section id="screen-game" class="screen d-none">
        <div class="round-banner card border-primary mb-3">
          <div class="card-body py-2 px-3">
            <p class="mb-1 fw-semibold" id="match-summary">X01</p>
            <p class="mb-0 small text-muted" id="game-phase-hint"></p>
          </div>
        </div>

        <div class="card shadow-sm mb-3">
          <div class="card-header py-3 current-player-header">
            <span class="current-player-name" id="current-player-name">-</span>
            <span class="current-player-action" id="current-player-action"></span>
          </div>
          <div class="card-body">
            <p class="small mb-3" id="turn-hint"></p>
            <div id="throws-panel"></div>
          </div>
          <div class="card-footer bg-transparent border-top-0 pt-0 px-3 pb-3">
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-success btn-lg" id="btn-confirm-turn" disabled>Confirm turn - -</button>
              <button type="button" class="btn btn-outline-danger btn-lg" id="btn-busted-turn">Busted</button>
            </div>
          </div>
        </div>

        <div class="card shadow-sm mb-3">
          <div class="card-header py-2"><strong>Scores</strong></div>
          <div class="table-responsive mb-0">
            <table class="table table-sm table-striped mb-0 align-middle" id="score-table">
              <thead>
                <tr>
                  <th scope="col">Player</th>
                  <th scope="col" class="text-end">Remaining</th>
                  <th scope="col" class="text-end games-won-col">Games</th>
                  <th scope="col" class="text-end in-status-col">In</th>
                </tr>
              </thead>
              <tbody id="score-tbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="screen-finished" class="screen d-none">
        <h2 class="h4 mb-3">Final standings</h2>
        <div id="standings-podium-wrap" class="standings-podium-wrap mb-4"></div>
        <div id="visit-scoreboards-wrap" class="d-none"></div>
        <h3 class="h6 text-muted text-uppercase mb-2 d-none letter-spacing-tight" id="standings-others-heading">Other places</h3>
        <ul class="list-group shadow-sm mb-4 d-none" id="standings-rest-list"></ul>
        <button type="button" class="btn btn-primary btn-lg w-100" id="btn-new-from-finished">New game</button>
      </section>
    </main>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
